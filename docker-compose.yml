services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload
      POSTGRES_DB: unlocked_ventures
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payload -d unlocked_ventures']
      interval: 5s
      timeout: 5s
      retries: 20

  transcriber:
    build: ./transcriber
    environment:
      TRANSCRIBER_SECRET: ${TRANSCRIBER_SECRET:-}
    volumes:
      - whisper-models:/root/.cache/whisper
    expose:
      - '8080'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/health")',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: node:22-bookworm
    working_dir: /app
    init: true
    extra_hosts:
      - host.docker.internal:host-gateway
    command: sh /app/scripts/docker-dev.sh
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      TRANSCRIBER_URL: http://transcriber:8080
      # GEMINI_API_KEY comes from env_file (.env). Do not set it here with
      # ${GEMINI_API_KEY:-} — an empty interpolation overrides env_file.
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      transcriber:
        condition: service_healthy

volumes:
  pgdata:
  node_modules:
  whisper-models:
