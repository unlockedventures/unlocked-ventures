services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload
      POSTGRES_DB: unlocked_ventures
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payload -d unlocked_ventures']
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: node:22-bookworm
    working_dir: /app
    init: true
    command: sh -c "corepack enable && corepack prepare pnpm@10 --activate && pnpm install --frozen-lockfile && pnpm dev --hostname 0.0.0.0 --port 3000"
    ports:
      - '3000:3000'
    env_file:
      - .env
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  node_modules:
