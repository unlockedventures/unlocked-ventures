# Optional packaging: bind-mount app + pnpm dev in Compose (not required for coding).
# Default develop path: README.md (host pnpm). Production/IONOS: docker-compose.yml.
# Usage: docker compose -f docker-compose.dev.yml up -d
# Same Docker network name as production: unlocked-venture.

services:
  db:
    container_name: db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload
      POSTGRES_DB: unlocked_ventures
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payload -d unlocked_ventures']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  whisper:
    container_name: whisper
    build:
      context: ./transcriber
      args:
        APP_UID: 10001
        APP_GID: 10001
    user: '10001:10001'
    environment:
      TRANSCRIBER_SECRET: ${TRANSCRIBER_SECRET:-}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
    volumes:
      - whisper-models:/home/app/.cache/whisper
    expose:
      - '8080'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/health")',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp/pipeline:size=512m,uid=10001,gid=10001,mode=0700

  kokoro:
    container_name: kokoro
    build:
      context: ./kokoro
    user: '1000:1000'
    expose:
      - '8880'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8880/health")',
        ]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  app:
    container_name: app
    image: node:22-alpine
    working_dir: /app
    init: true
    extra_hosts:
      - host.docker.internal:host-gateway
    command: >
      sh -c "tr -d '\\r' < /app/scripts/docker-dev.sh > /tmp/docker-dev.sh
      && exec sh /tmp/docker-dev.sh"
    ports:
      - '3000:3000'
    env_file:
      - path: .env
        required: false
    environment:
      TRANSCRIBER_URL: http://whisper:8080
      KOKORO_BASE_URL: http://kokoro:8880
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
      whisper:
        condition: service_healthy
      kokoro:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

networks:
  default:
    name: unlocked-venture

volumes:
  pgdata:
  node_modules:
  whisper-models:
