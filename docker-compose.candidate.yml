# Standalone candidate app for zero-downtime deploys (not merged with docker-compose.yml).
# Production :3000 stays up while this listens on 127.0.0.1:3001.
# Joins the same fixed network as the live stack: unlocked-venture.

services:
  app:
    container_name: app-candidate
    image: uv-app:local
    user: '10001:10001'
    ports:
      - '127.0.0.1:3001:3000'
    env_file:
      - path: .env
        required: true
    environment:
      TRANSCRIBER_URL: http://whisper:8080
      KOKORO_BASE_URL: http://kokoro:8880
      ENSURE_SCHEMA_STRICT: ${ENSURE_SCHEMA_STRICT:-0}
      TMPDIR: /app/tmp
      TRANSCRIBER_TIMEOUT_SECONDS: ${TRANSCRIBER_TIMEOUT_SECONDS:-43200}
      GENERATION_LOCK_HOURS: ${GENERATION_LOCK_HOURS:-12}
      KOKORO_TIMEOUT_MS: ${KOKORO_TIMEOUT_MS:-1800000}
    volumes:
      - ${UV_MEDIA_DIR:-./media}:/app/media
    tmpfs:
      - /app/tmp:size=256m,uid=10001,gid=10001,mode=0700
    mem_limit: 1900m
    pids_limit: 512
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: 'no'

networks:
  default:
    name: unlocked-venture
    external: true
